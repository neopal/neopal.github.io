<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="dpo-t">
<title id="dpo-t">Deux chemins à partir des mêmes paires de réponses : le RLHF classique entraîne un modèle de récompense puis fait générer et noter le modèle par renforcement ; DPO creuse directement l'écart en faveur de la réponse préférée, par rapport à une copie figée du modèle de départ.</title>
<text class="m d" x="85" y="16" text-anchor="middle">RLHF classique</text>
<text class="b ac" x="275" y="17" text-anchor="middle">DPO</text>
<rect class="bx" x="5" y="28" width="160" height="40" rx="6"/>
<text class="m" x="85" y="53" text-anchor="middle">paires notées</text>
<path class="lm" d="M85 68 v16"/><path class="lm" d="M80 79 l5 5 l5 -5"/>
<rect class="bx" x="5" y="88" width="160" height="48" rx="6"/>
<text class="m" x="85" y="108" text-anchor="middle">entraîne un modèle</text>
<text class="m" x="85" y="126" text-anchor="middle">de récompense</text>
<path class="lm" d="M85 136 v16"/><path class="lm" d="M80 147 l5 5 l5 -5"/>
<rect class="bx" x="5" y="156" width="160" height="48" rx="6"/>
<text class="m" x="85" y="176" text-anchor="middle">renforcement</text>
<text class="m mu" x="85" y="194" text-anchor="middle">génère, puis note</text>
<path class="lm" d="M85 204 v16"/><path class="lm" d="M80 215 l5 5 l5 -5"/>
<rect class="bx" x="5" y="224" width="160" height="40" rx="6"/>
<text class="m" x="85" y="249" text-anchor="middle">modèle réglé</text>
<rect class="bx" x="195" y="28" width="160" height="40" rx="6"/>
<text class="m" x="275" y="53" text-anchor="middle">paires notées</text>
<path class="la" d="M275 68 v24"/><path class="la" d="M269 86 l6 6 l6 -6"/>
<rect class="bxa" x="195" y="96" width="160" height="96" rx="6"/>
<text class="b ac" x="275" y="120" text-anchor="middle">écart creusé</text>
<text class="m" x="275" y="140" text-anchor="middle">vers la préférée,</text>
<text class="m mu" x="275" y="158" text-anchor="middle">par rapport à une</text>
<text class="m mu" x="275" y="176" text-anchor="middle">copie figée</text>
<path class="la" d="M275 192 v28"/><path class="la" d="M269 214 l6 6 l6 -6"/>
<rect class="bx" x="195" y="224" width="160" height="40" rx="6"/>
<text class="m" x="275" y="249" text-anchor="middle">modèle réglé</text>
<text class="i mu" x="0" y="294">DPO se passe du modèle de récompense et</text>
<text class="i mu" x="0" y="313">des réponses générées en cours de route.</text>
</svg>
