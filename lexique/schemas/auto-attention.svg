<text class="m mu" x="360" y="16" text-anchor="end">dernier mot</text>
<text class="big ac" x="40" y="162.5" text-anchor="middle">grand</text>
<text class="big ac" x="320" y="162.5" text-anchor="middle">petit</text>
<text class="m" x="180" y="44" text-anchor="middle">Le</text>
