<path class="lm" opacity="0.4" d="M74 155.5 L142 103"/>
<path class="lm" opacity="0.4" d="M286 155.5 L218 103"/>
<text class="m" x="180" y="128" text-anchor="middle">pas</text>
<path class="lm" opacity="0.4" d="M74 155.5 L142 124"/>
<path class="lm" opacity="0.4" d="M286 155.5 L218 124"/>
<text class="m" x="180" y="149" text-anchor="middle">dans</text>
<path class="lm" opacity="0.4" d="M74 155.5 L142 145"/>
<path class="lm" opacity="0.4" d="M286 155.5 L218 145"/>
<text class="m" x="180" y="170" text-anchor="middle">le</text>
<path class="lm" opacity="0.4" d="M74 155.5 L142 166"/>
<path class="lm" opacity="0.4" d="M286 155.5 L218 166"/>
<text class="m b" x="180" y="191" text-anchor="middle">sac</text>
<path class="lm" opacity="0.4" d="M74 155.5 L142 187"/>
<path class="la" style="stroke-width:5" d="M286 155.5 L218 187"/>
<text class="m" x="180" y="212" text-anchor="middle">parce</text>
<path class="lm" opacity="0.4" d="M74 155.5 L142 208"/>
<path class="lm" opacity="0.4" d="M286 155.5 L218 208"/>
<text class="m" x="180" y="233" text-anchor="middle">qu'il</text>
<path class="lm" opacity="0.4" d="M74 155.5 L142 229"/>
<path class="lm" opacity="0.4" d="M286 155.5 L218 229"/>
<text class="m" x="180" y="254" text-anchor="middle">est</text>
<path class="lm" opacity="0.4" d="M74 155.5 L142 250"/>
<path class="lm" opacity="0.4" d="M286 155.5 L218 250"/>
<text class="m" x="180" y="275" text-anchor="middle">trop</text>
<path class="lm" opacity="0.4" d="M74 155.5 L142 271"/>
<path class="lm" opacity="0.4" d="M286 155.5 L218 271"/>
<text class="i mu" x="0" y="309">Un seul mot changé envoie l'essentiel de</text>
<text class="i mu" x="0" y="329">l'attention vers le trophée ou vers le sac.</text>
