<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 334" role="img" aria-labelledby="auto-attention-t">
<title id="auto-attention-t">La phrase « Le trophée ne rentre pas dans le sac parce qu'il est trop » écrite en colonne : le dernier mot « grand » envoie l'essentiel de son attention vers « trophée », le dernier mot « petit » vers « sac », et des traits fins vers les autres mots.</title>
