<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="transformer-t">
<title id="transformer-t">La même phrase de six tokens traitée par un réseau récurrent, qui passe sa mémoire d'un mot au suivant en six étapes, puis par un transformer, où l'attention relie tous les tokens dans la même étape.</title>
