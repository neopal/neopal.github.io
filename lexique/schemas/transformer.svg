<path class="ln" d="M267.0 52 V68"/>
<circle class="fd" cx="267.0" cy="78" r="10"/>
<circle class="lm" cx="267.0" cy="78" r="10"/>
<path class="la" d="M278.0 78 H313.0"/><path class="la" d="M308.0 74 l5 4 l-5 4"/>
<text class="m ac" x="267.0" y="108" text-anchor="middle">5</text>
<rect class="bx" x="299" y="26" width="52" height="26" rx="4"/>
<text class="m" x="325.0" y="44" text-anchor="middle">.</text>
<path class="ln" d="M325.0 52 V68"/>
