<text class="m ac" x="151.0" y="108" text-anchor="middle">3</text>
<rect class="bx" x="183" y="26" width="52" height="26" rx="4"/>
<text class="m" x="209.0" y="44" text-anchor="middle">voisin</text>
<path class="ln" d="M209.0 52 V68"/>
<circle class="fd" cx="209.0" cy="78" r="10"/>
