<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" role="img" aria-labelledby="mythe-detecteur-de-texte-ia-t">
<title id="mythe-detecteur-de-texte-ia-t">Deux courbes sur un axe qui va du texte prévisible au texte surprenant : les textes d'IA à gauche, les textes humains à droite, qui se chevauchent. Le détecteur tranche par un seuil ; un texte humain très prévisible tombe du côté IA, et un texte d'IA reformulé passe du côté humain.</title>
<text class="m ac" x="0" y="20">jugé IA</text>
<text class="m mu" x="360" y="20" text-anchor="end">jugé humain</text>
