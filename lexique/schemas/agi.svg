<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img" aria-labelledby="agi-t">
<title id="agi-t">Dans l'enquête d'AI Impacts, la date à laquelle les chercheurs donnent une chance sur deux à l'événement dépend de la question : 2047 pour surpasser les humains dans toutes les tâches, contre 2060 un an plus tôt, et 2116 pour automatiser tous les métiers, contre 2164.</title>
<text x="0" y="26">Les machines surpassent les humains</text>
<text x="0" y="44">dans toutes les tâches</text>
<path class="ln" d="M20 70 H340"/>
<path class="la" d="M61 70 H45"/>
<path class="la" d="M51 65 l-6 5 l6 5"/>
<circle class="bx" cx="69" cy="70" r="6"/>
<circle class="fa" cx="37" cy="70" r="6"/>
<text class="m mu" x="62" y="94">2060</text>
<text class="m ac" x="44" y="94" text-anchor="end">2047</text>
<text x="0" y="136">Tous les métiers sont</text>
<text x="0" y="154">entièrement automatisables</text>
<path class="ln" d="M20 180 H340"/>
<path class="la" d="M317 180 H215"/>
<path class="la" d="M221 175 l-6 5 l6 5"/>
<circle class="bx" cx="325" cy="180" r="6"/>
<circle class="fa" cx="207" cy="180" r="6"/>
<text class="m mu" x="325" y="204" text-anchor="middle">2164</text>
<text class="m ac" x="207" y="204" text-anchor="middle">2116</text>
<path class="lm" d="M20 232 H340"/>
<path class="lm" d="M45 228 V236"/>
<text class="m mu" x="45" y="252" text-anchor="middle">2050</text>
<path class="lm" d="M168 228 V236"/>
<text class="m mu" x="168" y="252" text-anchor="middle">2100</text>
<path class="lm" d="M291 228 V236"/>
<text class="m mu" x="291" y="252" text-anchor="middle">2150</text>
<circle class="bx" cx="8" cy="276" r="6"/>
<text class="m mu" x="20" y="281">enquête précédente</text>
<circle class="fa" cx="194" cy="276" r="6"/>
<text class="m mu" x="206" y="281">janvier 2024</text>
<text class="i mu" x="4" y="312">Changer la question déplace la date</text>
<text class="i mu" x="4" y="332">de plusieurs décennies.</text>
</svg>
