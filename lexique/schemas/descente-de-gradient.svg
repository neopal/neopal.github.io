<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 236" role="img" aria-labelledby="descente-de-gradient-t">
<title id="descente-de-gradient-t">Trois descentes sur la même courbe de loss : avec un pas trop grand les points sautent d'un versant à l'autre et s'éloignent du fond, avec un bon pas ils y arrivent, avec un pas trop petit ils avancent à peine.</title>
<text class="m d" x="0" y="14">loss</text>
<path class="lm" d="M5 30 Q55 190 105 30"/>
<path class="lr" d="M30.0 90.0 L85.0 81.2 L20.0 70.8 L98.0 50.8 L8.0 39.3" fill="none" opacity="0.7"/>
<circle class="bxa" cx="30.0" cy="90.0" r="4.5"/>
<circle class="fa" cx="85.0" cy="81.2" r="3.5"/>
<circle class="fa" cx="20.0" cy="70.8" r="3.5"/>
<circle class="fa" cx="98.0" cy="50.8" r="3.5"/>
<circle class="fa" cx="8.0" cy="39.3" r="5"/>
<text class="m" x="55" y="146" text-anchor="middle">pas trop grand</text>
<text class="m red" x="55" y="166" text-anchor="middle">diverge</text>
<path class="lm" d="M130 30 Q180 190 230 30"/>
<path class="la" d="M135.0 45.2 L153.0 86.7 L165.0 102.8 L173.0 108.4 L178.0 109.9" fill="none" opacity="0.7"/>
<circle class="bxa" cx="135.0" cy="45.2" r="4.5"/>
<circle class="fa" cx="153.0" cy="86.7" r="3.5"/>
<circle class="fa" cx="165.0" cy="102.8" r="3.5"/>
<circle class="fa" cx="173.0" cy="108.4" r="3.5"/>
<circle class="fa" cx="178.0" cy="109.9" r="5"/>
<text class="m" x="180" y="146" text-anchor="middle">bon pas</text>
<text class="m ac" x="180" y="166" text-anchor="middle">converge</text>
<path class="lm" d="M255 30 Q305 190 355 30"/>
<path class="la" d="M260.0 45.2 L264.0 56.2 L268.0 66.2 L272.0 75.2 L276.0 83.1" fill="none" opacity="0.7"/>
<circle class="bxa" cx="260.0" cy="45.2" r="4.5"/>
<circle class="fa" cx="264.0" cy="56.2" r="3.5"/>
<circle class="fa" cx="268.0" cy="66.2" r="3.5"/>
<circle class="fa" cx="272.0" cy="75.2" r="3.5"/>
<circle class="fa" cx="276.0" cy="83.1" r="5"/>
<text class="m" x="305" y="146" text-anchor="middle">pas trop petit</text>
<text class="m mu" x="305" y="166" text-anchor="middle">n'avance plus</text>
<text class="i mu" x="0" y="206">Chaque point est un pas, et le learning rate</text>
<text class="i mu" x="0" y="226">en fixe la longueur.</text>
</svg>
