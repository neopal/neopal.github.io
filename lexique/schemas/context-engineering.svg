<title id="context-engineering-t">La fenêtre de contexte d'un agent à quatre moments : au début la consigne et beaucoup de place libre ; après des dizaines d'actions, une fenêtre pleine de résultats d'outils où la consigne se noie ; puis les anciens résultats d'outils effacés ; enfin la conversation résumée, qui libère de la place.</title>
