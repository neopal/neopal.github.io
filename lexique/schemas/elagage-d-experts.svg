<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" role="img" aria-labelledby="elagage-d-experts-t">
<title id="elagage-d-experts-t">Élagage d'experts : des exemples de calibration traversent une couche de 8 experts, chaque expert reçoit une note, les deux moins bien notés sont retirés, et le routeur fait toujours travailler 2 experts par token, choisis parmi les 6 restants. En 4 bits, Qwen3-Coder-30B passe ainsi de 18,6 Go à 15,2 Go, sous les 16 Go d'une carte graphique.</title>
<circle class="bxa" cx="64" cy="15" r="10"/>
<text class="m ac b" x="64" y="20" text-anchor="middle">1</text>
<rect class="bx" x="80" y="2" width="200" height="26" rx="5"/>
<text class="m" x="180" y="19" text-anchor="middle">exemples de calibration</text>
<path class="la" d="M180 30 V44"/><path class="la" d="M176 39 l4 5 l4 -5"/>
<rect class="bx" x="135" y="46" width="90" height="26" rx="5"/>
<text class="m" x="180" y="63" text-anchor="middle">routeur</text>
<circle class="bxa" cx="244" cy="59" r="10"/>
<text class="m ac b" x="244" y="64" text-anchor="middle">3</text>
<text class="m ac" x="260" y="64">2 par token</text>
<path class="la" d="M180 74 L26 98"/>
<path class="la" d="M180 74 L290 98"/>
<rect class="bxa" x="9" y="100" width="34" height="30" rx="4"/>
<text class="m ac b" x="26" y="120" text-anchor="middle">E1</text>
<rect class="bx" x="53" y="100" width="34" height="30" rx="4"/>
<text class="m d" x="70" y="120" text-anchor="middle">E2</text>
<rect class="bx" x="97" y="100" width="34" height="30" rx="4" opacity="0.3"/>
<text class="m d" x="114" y="120" text-anchor="middle" opacity="0.3">E3</text>
<path class="lr" d="M97 100 L131 130 M131 100 L97 130"/>
<rect class="bx" x="141" y="100" width="34" height="30" rx="4"/>
<text class="m d" x="158" y="120" text-anchor="middle">E4</text>
<rect class="bx" x="185" y="100" width="34" height="30" rx="4"/>
<text class="m d" x="202" y="120" text-anchor="middle">E5</text>
<rect class="bx" x="229" y="100" width="34" height="30" rx="4" opacity="0.3"/>
<text class="m d" x="246" y="120" text-anchor="middle" opacity="0.3">E6</text>
<path class="lr" d="M229 100 L263 130 M263 100 L229 130"/>
<rect class="bxa" x="273" y="100" width="34" height="30" rx="4"/>
<text class="m ac b" x="290" y="120" text-anchor="middle">E7</text>
<rect class="bx" x="317" y="100" width="34" height="30" rx="4"/>
<text class="m d" x="334" y="120" text-anchor="middle">E8</text>
<rect class="fl" x="17" y="146" width="18" height="40"/>
<rect class="fl" x="61" y="156" width="18" height="30"/>
<rect class="fd" x="105" y="180" width="18" height="6"/>
<rect class="fl" x="149" y="150" width="18" height="36"/>
<rect class="fl" x="193" y="162" width="18" height="24"/>
<rect class="fd" x="237" y="182" width="18" height="4"/>
<rect class="fl" x="281" y="142" width="18" height="44"/>
<rect class="fl" x="325" y="166" width="18" height="20"/>
<path class="ln" d="M4 187 H356"/>
<circle class="bxa" cx="10" cy="204" r="10"/>
<text class="m ac b" x="10" y="209" text-anchor="middle">2</text>
<text class="m" x="28" y="209">une note par expert, les 2 plus</text>
<text class="m" x="28" y="227">faibles sont retirés</text>
<text class="m mu" x="0" y="262">Qwen3-Coder-30B en 4 bits, 18,6 Go</text>
<rect class="fl" x="0" y="270" width="316" height="18" rx="2"/>
<text class="m ac" x="0" y="314">version élaguée, 15,2 Go</text>
<rect class="fa" x="0" y="322" width="258" height="18" rx="2"/>
<path class="lm dash" d="M272 246 V348"/>
<text class="m d" x="272" y="364" text-anchor="middle">carte de 16 Go</text>
<text class="i mu" x="0" y="388">La version élaguée passe sous les 16 Go,</text>
<text class="i mu" x="0" y="408">et calcule chaque token comme avant.</text>
</svg>
