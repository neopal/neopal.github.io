<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 354" role="img" aria-labelledby="effet-reine-rouge-t">
<title id="effet-reine-rouge-t">Courbes en escalier : le générateur progresse, le détecteur mis à jour le suit de près, et l'écart se creuse avec un détecteur figé.</title>
