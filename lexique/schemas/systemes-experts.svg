<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="systemes-experts-t">
<title id="systemes-experts-t">Un système expert : les faits du cas et une base de règles si-alors écrite avec des experts entrent dans le moteur d'inférence, qui enchaîne les règles jusqu'à une conclusion avec sa trace ; un cas que les règles n'ont pas prévu ne déclenche aucune règle.</title>
<text class="m mu" x="0" y="14">faits du cas</text>
<rect class="bx" x="0" y="22" width="130" height="78" rx="4"/>
<text class="m" x="14" y="46">fait A</text>
<text class="m" x="14" y="66">fait B</text>
<text class="m" x="14" y="86">fait E</text>
<text class="m mu" x="150" y="14">règles des experts</text>
<rect class="bx" x="150" y="22" width="210" height="78" rx="4"/>
<text class="m" x="162" y="46">R1  si A et B, alors C</text>
<text class="m" x="162" y="66">R2  si C, alors D</text>
<text class="m" x="162" y="86">R3  si D et E, alors F</text>
<path class="lm" d="M65 102 V130"/><path class="lm" d="M60 124 l5 6 l5 -6"/>
<path class="lm" d="M255 102 V130"/><path class="lm" d="M250 124 l5 6 l5 -6"/>
<rect class="bxa" x="0" y="134" width="360" height="40" rx="4"/>
<text class="b" x="180" y="159" text-anchor="middle">moteur d'inférence</text>
<path class="la" d="M90 176 V204"/><path class="la" d="M85 198 l5 6 l5 -6"/>
<path class="lr dash" d="M270 176 V204"/><path class="lr" d="M265 198 l5 6 l5 -6"/>
<rect class="bxa" x="0" y="208" width="170" height="62" rx="4"/>
<text class="ac b" x="14" y="232">conclusion F</text>
<text class="m mu" x="14" y="256">trace R1, R2, R3</text>
<rect class="bx" x="190" y="208" width="170" height="62" rx="4"/>
<text class="red" x="204" y="232">fait X imprévu</text>
<text class="m mu" x="204" y="256">aucune conclusion</text>
<text class="i mu" x="0" y="300">Le moteur ne conclut que sur ce que les</text>
<text class="i mu" x="0" y="320">règles ont prévu, et il dit lesquelles ont servi.</text>
</svg>
