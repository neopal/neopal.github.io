<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img" aria-labelledby="modele-t">
<title id="modele-t">Quatre espèces de modèles qui suivent le même schéma, une entrée, des paramètres appris, une sortie : le modèle de langage passe d'un texte au token suivant, le modèle de diffusion d'un bruit à une image, le modèle d'embedding d'une photo à des coordonnées, le modèle du monde d'un état et d'une action à l'état suivant. En bas, l'application entoure le modèle avec l'historique, la recherche web et l'interface.</title>
<text class="m d" x="0" y="14">entrée</text>
<text class="m d" x="164" y="14" text-anchor="middle">modèle</text>
<text class="m d" x="242" y="14">sortie</text>
<text class="m" x="0" y="47">texte</text>
<path class="lm" d="M84 42 h14"/><path class="lm" d="M93 37 l5 5 l-5 5"/>
<rect class="bx" x="104" y="24" width="120" height="36" rx="6"/>
<text x="164" y="47" text-anchor="middle">de langage</text>
<path class="lm" d="M226 42 h10"/><path class="lm" d="M231 37 l5 5 l-5 5"/>
<text class="m" x="242" y="47">token suivant</text>
<text class="m" x="0" y="95">bruit</text>
<path class="lm" d="M84 90 h14"/><path class="lm" d="M93 85 l5 5 l-5 5"/>
<rect class="bx" x="104" y="72" width="120" height="36" rx="6"/>
<text x="164" y="95" text-anchor="middle">de diffusion</text>
<path class="lm" d="M226 90 h10"/><path class="lm" d="M231 85 l5 5 l-5 5"/>
<text class="m" x="242" y="95">image</text>
<text class="m" x="0" y="143">photo</text>
<path class="lm" d="M84 138 h14"/><path class="lm" d="M93 133 l5 5 l-5 5"/>
<rect class="bx" x="104" y="120" width="120" height="36" rx="6"/>
<text x="164" y="143" text-anchor="middle">d'embedding</text>
<path class="lm" d="M226 138 h10"/><path class="lm" d="M231 133 l5 5 l-5 5"/>
<text class="m" x="242" y="143">coordonnées</text>
<text class="m" x="0" y="184">état</text>
<text class="m" x="0" y="200">+ action</text>
<path class="lm" d="M84 186 h14"/><path class="lm" d="M93 181 l5 5 l-5 5"/>
<rect class="bx" x="104" y="168" width="120" height="36" rx="6"/>
<text x="164" y="191" text-anchor="middle">du monde</text>
<path class="lm" d="M226 186 h10"/><path class="lm" d="M231 181 l5 5 l-5 5"/>
<text class="m" x="242" y="191">état suivant</text>
<text class="i mu" x="0" y="232">Toutes règlent leurs paramètres sur des</text>
<text class="i mu" x="0" y="250">exemples, puis les figent à l'usage.</text>
<rect class="ln dash" x="0" y="266" width="360" height="72" rx="8"/>
<text class="m d" x="12" y="284">application</text>
<rect class="bxa" x="12" y="294" width="80" height="32" rx="5"/>
<text class="m ac" x="52" y="315" text-anchor="middle">modèle</text>
<text class="m mu" x="108" y="306">historique</text>
<text class="m mu" x="108" y="326">recherche web</text>
<text class="m mu" x="214" y="306">interface</text>
</svg>
