<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 376" role="img" aria-labelledby="prefill-et-decode-t">
<title id="prefill-et-decode-t">Les deux phases d'une réponse : le prefill lit les dix tokens du message en un seul passage et remplit le KV cache ; le decode écrit un token par passage en relisant à chaque fois les poids du modèle. En bas, les deux vitesses mesurées par llama.cpp pour un même modèle, 7 340 tokens par seconde en lecture et 121 en écriture.</title>
<text class="m ac" x="0" y="16">prefill, la lecture</text>
<rect class="fl" x="0" y="28" width="18" height="18" rx="3"/>
<rect class="fl" x="21" y="28" width="18" height="18" rx="3"/>
<rect class="fl" x="42" y="28" width="18" height="18" rx="3"/>
<rect class="fl" x="63" y="28" width="18" height="18" rx="3"/>
<rect class="fl" x="84" y="28" width="18" height="18" rx="3"/>
<rect class="fl" x="105" y="28" width="18" height="18" rx="3"/>
<rect class="fl" x="126" y="28" width="18" height="18" rx="3"/>
<rect class="fl" x="147" y="28" width="18" height="18" rx="3"/>
<rect class="fl" x="168" y="28" width="18" height="18" rx="3"/>
<rect class="fl" x="189" y="28" width="18" height="18" rx="3"/>
<path class="la" d="M0 54 V60 H207 V54"/>
<path class="la" d="M214 37 H246 M240 31 L246 37 L240 43"/>
<rect class="bx" x="252" y="22" width="108" height="30" rx="4"/>
<text class="m" x="306" y="42" text-anchor="middle">KV cache</text>
<text class="m mu" x="0" y="80">10 tokens, un seul passage</text>
<text class="m d" x="0" y="98">limité par la puissance de calcul</text>
<text class="m ac" x="0" y="134">decode, l'écriture</text>
<rect class="bx" x="0" y="146" width="360" height="26" rx="4"/>
<text class="m mu" x="180" y="163" text-anchor="middle">poids du modèle</text>
<path class="lm dash" d="M31 172 V200 M101 172 V200 M171 172 V200 M241 172 V200 M311 172 V200"/>
<rect class="fa" x="22" y="200" width="18" height="18" rx="3"/>
<rect class="fa" x="92" y="200" width="18" height="18" rx="3"/>
<rect class="fa" x="162" y="200" width="18" height="18" rx="3"/>
<rect class="fa" x="232" y="200" width="18" height="18" rx="3"/>
<rect class="fa" x="302" y="200" width="18" height="18" rx="3"/>
<text class="m d" x="31" y="238" text-anchor="middle">pas 1</text>
<text class="m d" x="101" y="238" text-anchor="middle">pas 2</text>
<text class="m d" x="171" y="238" text-anchor="middle">pas 3</text>
<text class="m d" x="241" y="238" text-anchor="middle">pas 4</text>
<text class="m d" x="311" y="238" text-anchor="middle">pas 5</text>
<text class="m mu" x="0" y="262">1 token par passage, poids relus</text>
<text class="m d" x="0" y="280">limité par la bande passante mémoire</text>
<text class="m mu" x="0" y="314">lecture</text>
<rect class="fl" x="78" y="304" width="230" height="12" rx="2"/>
<text class="m" x="360" y="314" text-anchor="end">7 340</text>
<text class="m mu" x="0" y="336">écriture</text>
