<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-labelledby="gpu-t">
<title id="gpu-t">Les poids actifs passent de la mémoire HBM de 141 Go aux cœurs de calcul à 4,8 To par seconde, une fois par token écrit, et une partie des cœurs reste au repos pendant ce temps.</title>
