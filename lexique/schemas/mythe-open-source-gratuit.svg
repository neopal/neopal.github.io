<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="mythe-open-source-gratuit-t">
<title id="mythe-open-source-gratuit-t">Coût mensuel de Mistral Large 3 selon le volume de tokens écrits : par l'API, la facture monte avec le volume, à 1,50 dollar le million ; sur huit H100 loués, elle reste à environ 23 000 dollars par mois ; les deux se croisent vers 15 milliards de tokens par mois.</title>
<text class="m mu" x="0" y="14">dollars par mois</text>
<path class="ln" d="M40 30 V210 H340"/>
<text class="m d" x="34" y="65" text-anchor="end">45 k</text>
