<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 282" role="img" aria-labelledby="dead-internet-t">
<title id="dead-internet-t">Part du trafic web automatisé selon Imperva : 52 % en 2016, 51 % en 2024, plus de 53 % en 2025 ; et part des nouveaux articles en anglais jugés générés par l'IA selon Graphite : autour de la moitié.</title>
<text class="m mu" x="0" y="14">requêtes web faites par des machines,</text>
<text class="m mu" x="0" y="32">selon Imperva</text>
<text class="m" x="0" y="58">2016</text>
<rect class="fd" x="44" y="44" width="316" height="18" rx="3"/>
<rect class="fa" x="44" y="44" width="164" height="18" rx="3"/>
<text class="m ac" x="216" y="58">52 %</text>
<text class="m d" x="44" y="82">l'année de la « mort » selon la théorie</text>
<text class="m" x="0" y="108">2024</text>
<rect class="fd" x="44" y="94" width="316" height="18" rx="3"/>
<rect class="fa" x="44" y="94" width="161" height="18" rx="3"/>
<text class="m ac" x="213" y="108">51 %</text>
<text class="m" x="0" y="138">2025</text>
<rect class="fd" x="44" y="124" width="316" height="18" rx="3"/>
<rect class="fa" x="44" y="124" width="169" height="18" rx="3"/>
<text class="m ac" x="221" y="138">plus de 53 %</text>
<text class="m mu" x="0" y="172">nouveaux articles en anglais jugés</text>
<text class="m mu" x="0" y="190">générés par l'IA, selon Graphite</text>
<rect class="fd" x="44" y="202" width="316" height="18" rx="3"/>
<rect class="fa" x="44" y="202" width="158" height="18" rx="3"/>
<text class="m ac" x="210" y="216">autour de la moitié</text>
<text class="i mu" x="0" y="254">Beaucoup des machines qui visitent les pages</text>
<text class="i mu" x="0" y="274">les lisent sans rien y écrire.</text>
</svg>
