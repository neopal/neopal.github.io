<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="computer-use-t">
<title id="computer-use-t">La boucle du computer use : le modèle reçoit une capture d'écran, choisit un geste comme cliquer à une position précise, l'ordinateur l'exécute et renvoie une nouvelle capture, et ainsi de suite jusqu'à la fin de la tâche, sans aucune API.</title>
<rect class="bx" x="0" y="20" width="160" height="120" rx="6"/>
<rect class="fd" x="10" y="32" width="140" height="14" rx="2"/>
<rect class="fl" x="10" y="56" width="90" height="8" rx="2"/>
<rect class="fl" x="10" y="70" width="120" height="8" rx="2"/>
<rect class="fl" x="10" y="84" width="70" height="8" rx="2"/>
<rect class="fa" x="92" y="106" width="58" height="22" rx="4"/>
<path class="ln" d="M121 117 l10 10 M121 117 v12 l3 -3"/>
<text class="m mu" x="80" y="160" text-anchor="middle">l'écran</text>
<rect class="bxa" x="220" y="50" width="140" height="60" rx="6"/>
<text class="b ac" x="290" y="76" text-anchor="middle">modèle</text>
<text class="m mu" x="290" y="95" text-anchor="middle">où cliquer ?</text>
<path class="lm" d="M160 48 C190 40 200 40 218 60"/><path class="lm" d="M210 56 l8 4 l-2 -9"/>
<text class="m" x="190" y="30" text-anchor="middle">capture</text>
<path class="la" d="M220 104 C200 130 185 130 156 120"/><path class="la" d="M164 115 l-8 5 l9 3"/>
<text class="m ac" x="210" y="150" text-anchor="middle">clic (121, 117)</text>
<text class="m mu" x="0" y="200">tour 1   capture, puis clic</text>
<text class="m mu" x="0" y="220">tour 2   capture, puis texte tapé</text>
<text class="m mu" x="0" y="240">tour 3   capture, puis défilement</text>
<text class="m d" x="0" y="260">…        jusqu'à la fin de la tâche</text>
<text class="i mu" x="0" y="300">Chaque geste demande un aller-retour complet,</text>
<text class="i mu" x="0" y="319">et le modèle ne voit que des images fixes.</text>
</svg>
