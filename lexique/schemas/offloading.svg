<rect class="fd" x="256" y="224" width="16" height="16" rx="3"/>
<rect class="fd" x="290" y="224" width="16" height="16" rx="3"/>
<rect class="fa" x="324" y="224" width="16" height="16" rx="3"/>
<text class="m ac" x="80" y="260" text-anchor="middle">carte graphique</text>
<text class="m mu" x="280" y="260" text-anchor="middle">2 experts lus sur 12</text>
<text class="i mu" x="0" y="292">Chaque token attend tout ce qu'il doit relire</text>
<text class="i mu" x="0" y="312">dans la mémoire la plus lente.</text>
