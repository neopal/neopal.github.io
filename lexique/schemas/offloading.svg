<rect class="fl" x="286" y="40" width="22" height="36" rx="3"/>
<rect class="fl" x="318" y="40" width="22" height="36" rx="3"/>
<text class="m ac" x="80" y="106" text-anchor="middle">carte graphique</text>
<text class="m mu" x="280" y="106" text-anchor="middle">mémoire vive</text>
<text class="m" x="0" y="146">MoE, experts en mémoire vive</text>
<rect class="bxa" x="0" y="158" width="160" height="84" rx="6"/>
<rect class="bx" x="200" y="158" width="160" height="84" rx="6"/>
<text class="m ac" x="80" y="194" text-anchor="middle">attention</text>
<text class="m ac" x="80" y="216" text-anchor="middle">KV cache</text>
<path class="la" d="M160 190 H264 V184"/>
<path class="la" d="M160 218 H332 V224"/>
<rect class="fd" x="222" y="168" width="16" height="16" rx="3"/>
