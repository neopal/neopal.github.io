<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" role="img" aria-labelledby="offloading-t">
<title id="offloading-t">Deux façons de décharger un modèle trop gros pour la carte graphique : un modèle dense coupé par couches, où chaque token traverse aussi les couches restées en mémoire vive, et un MoE dont l'attention reste sur la carte, les experts en mémoire vive, et dont seuls les experts choisis pour le token sont lus.</title>
<text class="m" x="0" y="16">modèle dense, coupé par couches</text>
<rect class="bxa" x="0" y="28" width="160" height="60" rx="6"/>
<rect class="bx" x="200" y="28" width="160" height="60" rx="6"/>
