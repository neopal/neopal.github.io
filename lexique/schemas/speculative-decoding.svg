<text class="m" x="264.9" y="46" text-anchor="middle">2,5</text>
<circle class="bxa" cx="9" cy="89" r="9"/>
<text class="m ac" x="9" y="93.5" text-anchor="middle">2</text>
<text class="m mu" x="26" y="94">le grand vérifie tout en un passage</text>
<rect class="bx" x="0.0" y="106" width="25.8" height="24" rx="4"/>
