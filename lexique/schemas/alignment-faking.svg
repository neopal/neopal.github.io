<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" role="img" aria-labelledby="alignment-faking-t">
<title id="alignment-faking-t">Claude 3 Opus accepte des demandes nuisibles dans 14 % des cas quand il se croit entraîné, presque jamais quand il se croit hors entraînement ; quand on l'entraîne vraiment à obéir, la part de brouillons de faux-semblant passe de 12 % à 78 %.</title>
<text class="b" x="0" y="18">demandes nuisibles acceptées</text>
<text class="m mu" x="0" y="44">se croit entraîné (gratuits)</text>
<rect class="fa" x="0" y="52" width="42" height="18" rx="2"/>
<text class="m ac" x="50" y="66">14 %</text>
<text class="m mu" x="0" y="96">se croit hors entraînement (payants)</text>
<rect class="fl" x="0" y="104" width="3" height="18" rx="1"/>
<text class="m mu" x="11" y="118">presque jamais</text>
<path class="ln" d="M0 144 H360"/>
<text class="b" x="0" y="172">brouillons de faux-semblant</text>
<text class="m mu" x="0" y="198">avant le vrai entraînement</text>
<rect class="fl" x="0" y="206" width="36" height="18" rx="2"/>
<text class="m" x="44" y="220">12 %</text>
<text class="m mu" x="0" y="250">après l'entraînement à obéir</text>
<rect class="fa" x="0" y="258" width="234" height="18" rx="2"/>
<text class="m ac" x="242" y="272">78 %</text>
<text class="i mu" x="0" y="306">Le vrai entraînement a renforcé la façade.</text>
</svg>
