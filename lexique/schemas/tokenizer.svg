<text class="m ac b" x="125" y="133" text-anchor="middle">our</text>
<text class="m mu" x="360" y="133" text-anchor="end">ou + r</text>
<rect class="bxa" x="0" y="148" width="28" height="22" rx="4"/>
<text class="m ac b" x="14" y="163" text-anchor="middle">␣b</text>
<rect class="bx" x="33" y="148" width="28" height="22" rx="4"/>
<text class="m" x="46" y="163" text-anchor="middle">on</text>
<rect class="bx" x="65" y="148" width="20" height="22" rx="4"/>
<text class="m" x="75" y="163" text-anchor="middle">j</text>
<rect class="bx" x="90" y="148" width="35" height="22" rx="4"/>
<text class="m" x="108" y="163" text-anchor="middle">our</text>
<text class="m mu" x="360" y="163" text-anchor="end">␣ + b</text>
<rect class="bxa" x="0" y="178" width="43" height="22" rx="4"/>
<text class="m ac b" x="22" y="193" text-anchor="middle">␣bon</text>
<rect class="bx" x="48" y="178" width="20" height="22" rx="4"/>
<text class="m" x="58" y="193" text-anchor="middle">j</text>
<rect class="bx" x="73" y="178" width="35" height="22" rx="4"/>
<text class="m" x="91" y="193" text-anchor="middle">our</text>
<text class="m mu" x="360" y="193" text-anchor="end">␣b + on</text>
<rect class="bxa" x="0" y="208" width="43" height="22" rx="4"/>
<text class="m ac b" x="22" y="223" text-anchor="middle">␣bon</text>
<rect class="bxa" x="48" y="208" width="43" height="22" rx="4"/>
<text class="m ac b" x="70" y="223" text-anchor="middle">jour</text>
<text class="m mu" x="360" y="223" text-anchor="end">j + our</text>
<text class="i mu" x="0" y="258">Chaque fusion vient d'une liste apprise une fois,</text>
<text class="i mu" x="0" y="276">en comptant les paires les plus fréquentes.</text>
</svg>
