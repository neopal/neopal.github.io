<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-labelledby="tokenizer-t">
<title id="tokenizer-t">Exemple de découpage par BPE : « bonjour » précédé d'une espace part de ses caractères, puis des paires sont fusionnées une à une jusqu'aux deux tokens « bon » et « jour ».</title>
<text class="m d" x="0" y="14">« bonjour » en milieu de phrase</text>
<text class="m d" x="360" y="14" text-anchor="end">fusion</text>
<rect class="bx" x="0" y="28" width="20" height="22" rx="4"/>
<text class="m" x="10" y="43" text-anchor="middle">␣</text>
<rect class="bx" x="25" y="28" width="20" height="22" rx="4"/>
<text class="m" x="35" y="43" text-anchor="middle">b</text>
<rect class="bx" x="50" y="28" width="20" height="22" rx="4"/>
<text class="m" x="60" y="43" text-anchor="middle">o</text>
<rect class="bx" x="74" y="28" width="20" height="22" rx="4"/>
<text class="m" x="84" y="43" text-anchor="middle">n</text>
<rect class="bx" x="99" y="28" width="20" height="22" rx="4"/>
<text class="m" x="109" y="43" text-anchor="middle">j</text>
<rect class="bx" x="124" y="28" width="20" height="22" rx="4"/>
<text class="m" x="134" y="43" text-anchor="middle">o</text>
<rect class="bx" x="149" y="28" width="20" height="22" rx="4"/>
<text class="m" x="159" y="43" text-anchor="middle">u</text>
<rect class="bx" x="174" y="28" width="20" height="22" rx="4"/>
<text class="m" x="184" y="43" text-anchor="middle">r</text>
<rect class="bx" x="0" y="58" width="20" height="22" rx="4"/>
<text class="m" x="10" y="73" text-anchor="middle">␣</text>
<rect class="bx" x="25" y="58" width="20" height="22" rx="4"/>
<text class="m" x="35" y="73" text-anchor="middle">b</text>
<rect class="bxa" x="50" y="58" width="28" height="22" rx="4"/>
<text class="m ac b" x="63" y="73" text-anchor="middle">on</text>
<rect class="bx" x="82" y="58" width="20" height="22" rx="4"/>
<text class="m" x="92" y="73" text-anchor="middle">j</text>
<rect class="bx" x="107" y="58" width="20" height="22" rx="4"/>
<text class="m" x="117" y="73" text-anchor="middle">o</text>
<rect class="bx" x="132" y="58" width="20" height="22" rx="4"/>
<text class="m" x="142" y="73" text-anchor="middle">u</text>
<rect class="bx" x="157" y="58" width="20" height="22" rx="4"/>
<text class="m" x="167" y="73" text-anchor="middle">r</text>
<text class="m mu" x="360" y="73" text-anchor="end">o + n</text>
<rect class="bx" x="0" y="88" width="20" height="22" rx="4"/>
<text class="m" x="10" y="103" text-anchor="middle">␣</text>
<rect class="bx" x="25" y="88" width="20" height="22" rx="4"/>
<text class="m" x="35" y="103" text-anchor="middle">b</text>
<rect class="bx" x="50" y="88" width="28" height="22" rx="4"/>
<text class="m" x="63" y="103" text-anchor="middle">on</text>
<rect class="bx" x="82" y="88" width="20" height="22" rx="4"/>
<text class="m" x="92" y="103" text-anchor="middle">j</text>
<rect class="bxa" x="107" y="88" width="28" height="22" rx="4"/>
<text class="m ac b" x="121" y="103" text-anchor="middle">ou</text>
<rect class="bx" x="140" y="88" width="20" height="22" rx="4"/>
<text class="m" x="150" y="103" text-anchor="middle">r</text>
<text class="m mu" x="360" y="103" text-anchor="end">o + u</text>
<rect class="bx" x="0" y="118" width="20" height="22" rx="4"/>
<text class="m" x="10" y="133" text-anchor="middle">␣</text>
<rect class="bx" x="25" y="118" width="20" height="22" rx="4"/>
<text class="m" x="35" y="133" text-anchor="middle">b</text>
<rect class="bx" x="50" y="118" width="28" height="22" rx="4"/>
<text class="m" x="63" y="133" text-anchor="middle">on</text>
<rect class="bx" x="82" y="118" width="20" height="22" rx="4"/>
<text class="m" x="92" y="133" text-anchor="middle">j</text>
