<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-labelledby="human-in-the-loop-t">
<title id="human-in-the-loop-t">Part des commandes dangereuses bloquées dans l'expérience d'Anthropic : environ 17 % par les humains en début de session et 5 % après cinquante demandes, contre 89 % pour le classifieur du mode auto, quel que soit le moment.</title>
<text class="m d" x="0" y="14">commandes dangereuses bloquées</text>
<path class="ln" d="M40 30 h300 M40 120 h300"/>
<path class="lm" d="M40 30 v180 h300"/>
<text class="m mu" x="32" y="35" text-anchor="end">100</text>
<text class="m mu" x="32" y="125" text-anchor="end">50</text>
<text class="m mu" x="32" y="215" text-anchor="end">0</text>
<path class="la" d="M60 50 h260"/>
<circle class="fa" cx="60" cy="50" r="4"/>
<circle class="fa" cx="320" cy="50" r="4"/>
<text class="m ac" x="60" y="72">mode auto</text>
<text class="m ac" x="320" y="72" text-anchor="end">89 %</text>
<path class="lr dash" d="M60 179 L320 201"/>
<circle class="lr" cx="60" cy="179" r="4"/>
<circle class="lr" cx="320" cy="201" r="4"/>
<text class="m red" x="60" y="164">humains, 17 %</text>
<text class="m red" x="320" y="186" text-anchor="end">5 %</text>
<text class="m mu" x="40" y="234">début de</text>
<text class="m mu" x="40" y="250">session</text>
<text class="m mu" x="340" y="234" text-anchor="end">après 50</text>
<text class="m mu" x="340" y="250" text-anchor="end">demandes</text>
<text class="i mu" x="0" y="282">Plus les demandes s'accumulent, moins on en bloque.</text>
</svg>
