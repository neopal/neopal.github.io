<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="routage-de-modeles-t">
<title id="routage-de-modeles-t">Les quatre cas d'un routeur qui choisit entre un petit modèle à 5 dollars et un grand modèle à 50 dollars par million de tokens écrits : une demande facile envoyée au petit est juste et peu chère, envoyée au grand elle est juste mais dix fois plus chère ; une demande difficile envoyée au grand est juste, envoyée au petit elle donne une réponse fausse ou à refaire.</title>
<text class="m mu" x="0" y="16">le routeur l'envoie au</text>
<text class="m" x="155" y="44" text-anchor="middle">petit modèle</text>
<text class="m mu" x="155" y="62" text-anchor="middle">5 $ le million</text>
<text class="m" x="290" y="44" text-anchor="middle">grand modèle</text>
<text class="m mu" x="290" y="62" text-anchor="middle">50 $ le million</text>
<text class="m mu" x="0" y="96">demande</text>
<text class="m" x="0" y="114">facile</text>
<rect class="bxa" x="90" y="74" width="130" height="70" rx="3"/>
<path class="la" d="M106 92 l4 5 l8 -9"/>
<text class="m ac" x="124" y="98">juste,</text>
<text class="m ac" x="106" y="120">au prix le</text>
<text class="m ac" x="106" y="137">plus bas</text>
<rect class="bx" x="225" y="74" width="130" height="70" rx="3"/>
<path class="lm" d="M241 92 l4 5 l8 -9"/>
<text class="m mu" x="259" y="98">juste, mais</text>
<text class="m mu" x="241" y="120">dix fois plus</text>
<text class="m mu" x="241" y="137">cher</text>
<text class="m mu" x="0" y="176">demande</text>
<text class="m" x="0" y="194">difficile</text>
<rect class="bx" x="90" y="154" width="130" height="70" rx="3" style="stroke:#FF7A7A"/>
<path class="lr" d="M106 172 l10 10 M116 172 l-10 10"/>
<text class="m red" x="124" y="178">raté,</text>
<text class="m red" x="106" y="200">réponse fausse</text>
<text class="m red" x="106" y="217">ou refaite</text>
<rect class="bxa" x="225" y="154" width="130" height="70" rx="3"/>
<path class="la" d="M241 172 l4 5 l8 -9"/>
<text class="m ac" x="259" y="178">juste,</text>
<text class="m ac" x="241" y="200">le prix est</text>
<text class="m ac" x="241" y="217">justifié</text>
<text class="i mu" x="0" y="258">Le routeur choisit avant d'avoir vu</text>
<text class="i mu" x="0" y="280">la réponse, et chaque erreur se paie.</text>
</svg>
