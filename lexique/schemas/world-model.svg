<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" role="img" aria-labelledby="world-model-t">
<title id="world-model-t">Un modèle du monde part de la situation réelle, imagine deux suites selon l'action choisie, céder le passage ou passer, les prolonge de quelques pas, puis seule l'action dont la suite imaginée est la meilleure est jouée dans le vrai monde.</title>
