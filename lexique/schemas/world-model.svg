<rect class="ln dash" x="6" y="74" width="348" height="182" rx="10"/>
<text class="m d" x="18" y="246">imaginé par le modèle</text>
<path class="lm" d="M150 52 L96 110"/><path class="lm" d="M94 100 l2 10 l9 -4"/>
<path class="la" d="M210 52 L264 110"/><path class="la" d="M255 106 l9 4 l2 -10"/>
<text opacity="0.5" class="m" x="96" y="128" text-anchor="middle">« céder »</text>
<text class="m ac" x="264" y="128" text-anchor="middle">« passer »</text>
<rect class="bx" x="36" y="138" width="120" height="34" rx="6" opacity="0.5"/>
<text opacity="0.5" class="m" x="96" y="160" text-anchor="middle">état prédit +1</text>
<rect class="bxa" x="204" y="138" width="120" height="34" rx="6"/>
<text class="m" x="264" y="160" text-anchor="middle">état prédit +1</text>
<path class="lm" d="M96 172 v14" opacity="0.5"/><path class="lm" d="M91 181 l5 5 l5 -5" opacity="0.5"/>
<path class="la" d="M264 172 v14"/><path class="la" d="M259 181 l5 5 l5 -5"/>
<rect class="bx" x="36" y="190" width="120" height="34" rx="6" opacity="0.5"/>
<text opacity="0.5" class="m" x="96" y="212" text-anchor="middle">état prédit +2</text>
<rect class="bxa" x="204" y="190" width="120" height="34" rx="6"/>
<text class="m" x="264" y="212" text-anchor="middle">état prédit +2</text>
<text class="m d" x="12" y="302">dans le vrai monde</text>
<path class="la" d="M264 224 v52"/><path class="la" d="M259 271 l5 5 l5 -5"/>
<rect class="bxa" x="184" y="280" width="160" height="34" rx="6"/>
