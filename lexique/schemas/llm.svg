<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img" aria-labelledby="llm-t">
<title id="llm-t">Dans un chatbot, l'application empile ses instructions, l'historique, les pages trouvées sur le web et ton message, puis passe le tout au LLM, qui ne fait que prédire la suite.</title>
<rect class="ln dash" x="1" y="1" width="358" height="246" rx="10"/>
<text class="m d" x="18" y="24">l'application</text>
<rect class="bx" x="18" y="36" width="324" height="28" rx="4"/>
<text x="30" y="55">instructions de l'application</text>
<rect class="bx" x="18" y="68" width="324" height="28" rx="4"/>
<text x="30" y="87">historique de la conversation</text>
<rect class="bx" x="18" y="100" width="324" height="28" rx="4"/>
<text x="30" y="119">pages trouvées sur le web</text>
<rect class="bxa" x="18" y="132" width="324" height="28" rx="4"/>
<text class="ac b" x="30" y="151">ton message</text>
<path class="lm" d="M180 164 V178"/><path class="lm" d="M176 173 l4 5 l4 -5"/>
<rect class="bxa" x="90" y="182" width="180" height="50" rx="6"/>
<text class="b" x="180" y="203" text-anchor="middle">LLM</text>
<text class="m mu" x="180" y="222" text-anchor="middle">prédit la suite</text>
<path class="lm" d="M180 236 V268"/><path class="lm" d="M176 263 l4 5 l4 -5"/>
<text x="180" y="288" text-anchor="middle">réponse</text>
<text class="i mu" x="0" y="316">Le modèle reçoit un seul long texte, et ton</text>
<text class="i mu" x="0" y="334">message n'en est qu'un morceau.</text>
</svg>
