<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="entrainement-t">
<title id="entrainement-t">La boucle d'un pas d'entraînement : un texte coupé, le token prédit comparé au vrai, l'écart mesuré par la loss, puis tous les paramètres ajustés d'un cran avant le texte suivant.</title>
<rect class="bx" x="80" y="6" width="200" height="58" rx="6"/>
<text class="m mu" x="180" y="28" text-anchor="middle">texte coupé</text>
<text x="180" y="50" text-anchor="middle">« Il pleut, prends ton… »</text>
<path class="lm" d="M284 35 h20 v51"/><path class="lm" d="M299 80 l5 6 l5 -6"/>
<rect class="bx" x="200" y="90" width="160" height="100" rx="6"/>
<text class="m mu" x="212" y="114">token prédit</text>
<text class="red" x="212" y="134">« vélo »</text>
<text class="m mu" x="212" y="160">vraie suite</text>
<text class="ac" x="212" y="180">« parapluie »</text>
<path class="lm" d="M304 194 v32 h-20"/><path class="lm" d="M290 221 l-6 5 l6 5"/>
<rect class="bxa" x="80" y="198" width="200" height="58" rx="6"/>
<text class="m ac b" x="180" y="220" text-anchor="middle">loss</text>
<text x="180" y="242" text-anchor="middle">l'écart entre les deux</text>
<path class="lm" d="M76 226 h-20 v-32"/><path class="lm" d="M51 200 l5 -6 l5 6"/>
<rect class="bx" x="0" y="90" width="170" height="100" rx="6"/>
<text class="m mu" x="10" y="114">descente de gradient</text>
<text x="10" y="146">chaque paramètre</text>
<text x="10" y="166">bouge d'un cran</text>
<path class="lm" d="M56 86 v-51 h20"/><path class="lm" d="M70 30 l6 5 l-6 5"/>
<text class="i mu" x="0" y="280">Le texte fournit lui-même la bonne réponse,</text>
<text class="i mu" x="0" y="298">et aucun humain n'a besoin de l'annoter.</text>
</svg>
