<title id="multi-agents-t">Un agent principal découpe la tâche et la confie à trois sous-agents, qui travaillent chacun dans une fenêtre de contexte neuve et ne lui rapportent qu'un résumé. En tokens, un agent dépense environ 4 fois plus qu'une conversation, un système multi-agents environ 15 fois plus.</title>
