<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" role="img" aria-labelledby="geo-t">
<title id="geo-t">Effet de la réécriture d'une page sur sa visibilité dans la réponse d'un moteur génératif, d'après l'article GEO de 2023 : ajouter sources, citations ou chiffres donne 30 à 40 % de plus, le bourrage de mots-clés presque rien ; en citant ses sources, un site classé cinquième gagne 115 % quand le premier perd 30 %.</title>
<text class="m mu" x="0" y="14">visibilité dans la réponse</text>
<path class="ln" d="M150 26 V244"/>
<text class="m d" x="150" y="258" text-anchor="middle">0</text>
<text x="0" y="44">sources, citations, chiffres</text>
<rect class="fa" x="150" y="52" width="45" height="14" rx="2"/>
<rect class="fa" x="195" y="52" width="15" height="14" rx="2" opacity="0.45"/>
<text class="m ac" x="218" y="64">+30 à 40 %</text>
<text x="0" y="92">bourrage de mots-clés</text>
<rect class="fl" x="150" y="100" width="3" height="14"/>
<text class="m mu" x="162" y="112">presque rien</text>
<text class="m mu" x="0" y="146">en citant ses sources</text>
<text x="0" y="172">site classé 5e</text>
<rect class="fa" x="150" y="180" width="172" height="14" rx="2"/>
<text class="m ac" x="322" y="172" text-anchor="end">+115 %</text>
<text x="160" y="220">site classé 1er</text>
<rect class="fd" x="105" y="208" width="45" height="14" rx="2"/>
<rect class="lr" x="105" y="208" width="45" height="14" rx="2"/>
<text class="m red" x="98" y="220" text-anchor="end">-30 %</text>
<text class="i mu" x="4" y="288">La vieille recette du référencement n'aide</text>
<text class="i mu" x="4" y="308">plus, et les pages mal classées gagnent le plus.</text>
</svg>
