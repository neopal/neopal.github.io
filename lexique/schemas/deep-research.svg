<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" role="img" aria-labelledby="deep-research-t">
<title id="deep-research-t">Le deep research : une question devient un plan, plusieurs sous-agents cherchent en parallèle et lisent des dizaines de sources, puis un rapport rassemble le tout avec ses citations, dont seule une partie soutient vraiment la phrase citée, entre 40 et 80 % selon les systèmes.</title>
<rect class="bx" x="70" y="0" width="220" height="40" rx="6"/>
<text class="m" x="180" y="25" text-anchor="middle">ta question</text>
<path class="lm" d="M180 40 v14"/><path class="lm" d="M175 49 l5 5 l5 -5"/>
<rect class="bxa" x="70" y="58" width="220" height="40" rx="6"/>
<text class="b ac" x="180" y="83" text-anchor="middle">plan de recherche</text>
<path class="lm" d="M180 98 v10 M50 108 h260 M50 108 v12 M180 108 v12 M310 108 v12"/>
<rect class="bx" x="0" y="124" width="100" height="36" rx="6"/>
<text class="m" x="50" y="147" text-anchor="middle">sous-agent</text>
<rect class="bx" x="130" y="124" width="100" height="36" rx="6"/>
<text class="m" x="180" y="147" text-anchor="middle">sous-agent</text>
<rect class="bx" x="260" y="124" width="100" height="36" rx="6"/>
<text class="m" x="310" y="147" text-anchor="middle">sous-agent</text>
<g class="fl">
<rect x="8" y="172" width="18" height="22" rx="2"/><rect x="30" y="172" width="18" height="22" rx="2"/><rect x="52" y="172" width="18" height="22" rx="2"/><rect x="74" y="172" width="18" height="22" rx="2"/>
<rect x="138" y="172" width="18" height="22" rx="2"/><rect x="160" y="172" width="18" height="22" rx="2"/><rect x="182" y="172" width="18" height="22" rx="2"/><rect x="204" y="172" width="18" height="22" rx="2"/>
<rect x="268" y="172" width="18" height="22" rx="2"/><rect x="290" y="172" width="18" height="22" rx="2"/><rect x="312" y="172" width="18" height="22" rx="2"/><rect x="334" y="172" width="18" height="22" rx="2"/>
</g>
<text class="m mu" x="180" y="214" text-anchor="middle">des dizaines de pages lues</text>
<path class="lm" d="M50 222 v10 M180 222 v10 M310 222 v10 M50 232 h260 M180 232 v12"/><path class="lm" d="M175 239 l5 5 l5 -5"/>
<rect class="bxa" x="40" y="248" width="280" height="68" rx="6"/>
<text class="b ac" x="180" y="270" text-anchor="middle">rapport</text>
<text class="m" x="60" y="294">phrase [1]  phrase [2]  phrase [3]</text>
<path class="la" d="M120 302 h21"/><path class="la" d="M199 302 h21"/><path class="lr" d="M278 302 h21"/>
<text class="i mu" x="0" y="350">Selon les systèmes, 40 à 80 % des citations</text>
<text class="i mu" x="0" y="369">soutiennent vraiment la phrase qui les porte.</text>
</svg>
