<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-labelledby="mythe-bon-score-bon-modele-t">
<title id="mythe-bon-score-bon-modele-t">Étude METR de mars 2026 : 296 corrections d'agents validées par les tests de SWE-bench Verified, dont environ la moitié seulement aurait été acceptée par les mainteneurs, contre environ 68 % des corrections humaines de référence ; motifs de refus : le problème n'est pas vraiment réglé, autre chose casse, le code est hors des standards.</title>
<text class="m mu" x="0" y="14">296 corrections écrites par des agents</text>
<text x="0" y="42">correcteur automatique</text>
<rect class="fa" x="0" y="52" width="360" height="22" rx="2"/>
<text class="m" x="8" y="68" style="fill:#0b0b0b">tests passés : 100 %</text>
<text x="0" y="106">relecture des mainteneurs</text>
<rect class="fa" x="0" y="116" width="180" height="22" rx="2"/>
<rect class="bxa dash" x="181" y="116" width="179" height="22" rx="2"/>
<text class="m" x="8" y="132" style="fill:#0b0b0b">acceptées : la moitié</text>
<text class="m ac" x="352" y="132" text-anchor="end">refusées</text>
<text class="m mu" x="0" y="170">corrections humaines, même relecture</text>
<rect class="fl" x="0" y="180" width="245" height="22" rx="2"/>
<text class="m" x="8" y="196">acceptées : environ 68 %</text>
<text class="m ac" x="0" y="234">motifs de refus</text>
<text class="m" x="0" y="256">le problème n'est pas vraiment réglé</text>
<text class="m" x="0" y="276">la correction casse autre chose</text>
<text class="m" x="0" y="296">le code sort des standards du projet</text>
<text class="i mu" x="0" y="324">Le score ne voyait que la première ligne.</text>
</svg>
