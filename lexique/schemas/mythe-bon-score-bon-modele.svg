<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-labelledby="mythe-bon-score-bon-modele-t">
<title id="mythe-bon-score-bon-modele-t">Étude METR de mars 2026 : 296 corrections d'agents validées par les tests de SWE-bench Verified, dont environ la moitié seulement aurait été acceptée par les mainteneurs, contre environ 68 % des corrections humaines de référence ; motifs de refus : le problème n'est pas vraiment réglé, autre chose casse, le code sort des standards.</title>
<text class="m mu" x="0" y="14">296 corrections écrites par des agents</text>
<text x="0" y="44">validées par les tests</text>
<rect class="fa" x="0" y="54" width="260" height="20" rx="2"/>
<text class="m" x="360" y="69" text-anchor="end">toutes</text>
<text x="0" y="104">acceptées par les mainteneurs</text>
<rect class="fa" x="0" y="114" width="130" height="20" rx="2"/>
<rect class="bxa dash" x="131" y="114" width="129" height="20" rx="2"/>
<text class="m" x="360" y="129" text-anchor="end">la moitié</text>
<text class="m mu" x="0" y="164">corrections humaines, même relecture</text>
<rect class="fa" x="0" y="174" width="177" height="20" rx="2" opacity="0.4"/>
<text class="m" x="360" y="189" text-anchor="end">environ 68 %</text>
<text class="m ac" x="0" y="226">motifs de refus</text>
<text class="m" x="0" y="248">le problème n'est pas vraiment réglé</text>
<text class="m" x="0" y="268">la correction casse autre chose</text>
<text class="m" x="0" y="288">le code sort des standards du projet</text>
<text class="i mu" x="0" y="316">Les tests valident deux fois plus que la relecture.</text>
</svg>
