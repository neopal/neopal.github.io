<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 286" role="img" aria-labelledby="vibe-coding-t">
<title id="vibe-coding-t">La boucle du vibe coding : décrire, laisser l'IA écrire, tout accepter, juger si ça a l'air de marcher, recoller l'erreur ; l'étape tests et relecture, en pointillé, est celle que la version professionnelle ajoute.</title>
<rect class="bx" x="0" y="8" width="150" height="44" rx="4"/>
<text x="75" y="35" text-anchor="middle">tu décris l'appli</text>
<path class="lm" d="M154 30 h28"/><path class="lm" d="M176 25 l6 5 l-6 5"/>
<rect class="bx" x="190" y="8" width="170" height="44" rx="4"/>
<text x="275" y="35" text-anchor="middle">l'IA écrit le code</text>
<path class="lm" d="M275 56 v32"/><path class="lm" d="M270 82 l5 6 l5 -6"/>
<rect class="bxa dash" x="190" y="92" width="170" height="44" rx="4"/>
<text class="ac" x="275" y="119" text-anchor="middle">tests, relecture</text>
<path class="lm" d="M275 140 v32"/><path class="lm" d="M270 166 l5 6 l5 -6"/>
<rect class="bx" x="190" y="176" width="170" height="44" rx="4"/>
<text x="275" y="203" text-anchor="middle">« Accept All »</text>
<path class="lm" d="M186 198 h-28"/><path class="lm" d="M164 193 l-6 5 l6 5"/>
<rect class="bx" x="0" y="176" width="150" height="44" rx="4"/>
<text x="75" y="194" text-anchor="middle">ça a l'air</text>
<text x="75" y="212" text-anchor="middle">de marcher ?</text>
<path class="lm" d="M75 172 v-32"/><path class="lm" d="M70 146 l5 -6 l5 6"/>
<rect class="bx" x="0" y="92" width="150" height="44" rx="4"/>
<text x="75" y="119" text-anchor="middle">recolle l'erreur</text>
<path class="lm" d="M75 88 v-32"/><path class="lm" d="M70 62 l5 -6 l5 6"/>
<text class="i mu" x="0" y="256">Le vibe coding saute l'étape en pointillé, que</text>
<text class="i mu" x="0" y="276">l'agentic engineering remet dans la boucle.</text>
</svg>
