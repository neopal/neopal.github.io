<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" role="img" aria-labelledby="jepa-t">
<title id="jepa-t">Comparaison de deux façons d'apprendre sur une image dont une partie est cachée : un modèle génératif doit prédire chacun des pixels cachés, alors que JEPA fait passer la partie visible et la partie cachée dans un encodeur et mesure l'erreur entre la représentation prédite et la représentation de la partie cachée.</title>
