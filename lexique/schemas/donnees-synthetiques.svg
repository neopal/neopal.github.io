<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 358" role="img" aria-labelledby="donnees-synthetiques-t">
<title id="donnees-synthetiques-t">Fabrication de données synthétiques : un texte réel sert de graine, un modèle générateur en tire des questions, des exercices et des résumés, un contrôle écarte les variantes fausses, et ce qui reste entraîne un nouveau modèle.</title>
<rect class="bx" x="60" y="4" width="240" height="46" rx="6"/>
<text class="b" x="180" y="24" text-anchor="middle">graine réelle</text>
<text class="m mu" x="180" y="42" text-anchor="middle">ex. un article de Wikipédia</text>
<path class="lm" d="M180 50 v14"/><path class="lm" d="M175 59 l5 5 l5 -5"/>
<rect class="bx" x="90" y="68" width="180" height="34" rx="6"/>
<text class="m" x="180" y="90" text-anchor="middle">modèle générateur</text>
<path class="ln" d="M180 102 v8 M43 110 h272 M43 110 v12 M134 110 v12 M225 110 v12 M315 110 v12"/>
<rect class="bx" x="1" y="124" width="84" height="30" rx="5"/>
<text class="m" x="43" y="144" text-anchor="middle">question</text>
<rect class="bx" x="92" y="124" width="84" height="30" rx="5"/>
<text class="m" x="134" y="144" text-anchor="middle">exercice</text>
<rect class="bx" x="183" y="124" width="84" height="30" rx="5"/>
<text class="m" x="225" y="144" text-anchor="middle">résumé</text>
<rect class="bx" x="274" y="124" width="84" height="30" rx="5"/>
<text class="m red" x="316" y="144" text-anchor="middle">erreur</text>
<path class="lm" d="M43 154 v26 M134 154 v26 M225 154 v26"/>
<path class="lr" d="M316 154 v20"/>
<path class="lm dash" d="M0 186 h360"/>
<path class="lr" d="M308 178 l16 16 M324 178 l-16 16"/>
<text class="m mu" x="360" y="212" text-anchor="end">contrôle</text>
<path class="lm" d="M43 192 v10 l90 14 M134 192 v24 M225 192 v10 l-90 14"/>
<path class="lm" d="M129 214 l5 5 l5 -5"/>
<rect class="bx" x="44" y="222" width="180" height="34" rx="6"/>
<text class="m" x="134" y="244" text-anchor="middle">jeu d'entraînement</text>
<path class="la" d="M134 256 v14"/><path class="la" d="M128 264 l6 6 l6 -6"/>
<rect class="bxa" x="44" y="274" width="180" height="34" rx="6"/>
<text class="b ac" x="134" y="296" text-anchor="middle">nouveau modèle</text>
<text class="i mu" x="0" y="332">Une donnée synthétique vaut ce que valent</text>
<text class="i mu" x="0" y="351">sa graine et le contrôle qui l'a retenue.</text>
</svg>
