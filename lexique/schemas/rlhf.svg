<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" aria-labelledby="rlhf-t">
<title id="rlhf-t">Le RLHF en deux temps : des notateurs classent deux réponses et un reward model apprend à prédire leur choix, puis le modèle est ajusté en boucle, sans humain, pour obtenir de meilleures notes de ce reward model.</title>
<rect class="bx" x="0" y="14" width="92" height="28" rx="4"/>
<text class="m" x="46" y="33" text-anchor="middle">réponse A</text>
<rect class="bx" x="0" y="54" width="92" height="28" rx="4"/>
<text class="m" x="46" y="73" text-anchor="middle">réponse B</text>
<path class="lm" d="M96 48 h14"/><path class="lm" d="M104 43 l6 5 l-6 5"/>
<rect class="bx" x="114" y="20" width="104" height="56" rx="4"/>
<text class="m mu" x="166" y="42" text-anchor="middle">notateurs</text>
<text x="166" y="63" text-anchor="middle">A plutôt que B</text>
<path class="lm" d="M222 48 h14"/><path class="lm" d="M230 43 l6 5 l-6 5"/>
<rect class="bxa" x="240" y="14" width="120" height="192" rx="6"/>
<text class="m ac b" x="300" y="98" text-anchor="middle">reward</text>
<text class="m ac b" x="300" y="116" text-anchor="middle">model</text>
<text x="300" y="140" text-anchor="middle">prédit la note</text>
<text x="300" y="158" text-anchor="middle">humaine</text>
<path class="ln dash" d="M0 104 H230"/>
<rect class="bx" x="0" y="130" width="112" height="76" rx="4"/>
<text class="b" x="56" y="160" text-anchor="middle">modèle</text>
<text class="m mu" x="56" y="184" text-anchor="middle">ajusté (PPO)</text>
<text class="m" x="176" y="142" text-anchor="middle">réponse</text>
<path class="lm" d="M116 152 h118"/><path class="lm" d="M228 147 l6 5 l-6 5"/>
<path class="la" d="M234 182 h-118"/><path class="la" d="M122 177 l-6 5 l6 5"/>
<text class="m ac" x="176" y="202" text-anchor="middle">note</text>
<text class="i mu" x="0" y="242">Le modèle apprend à plaire au reward model,</text>
<text class="i mu" x="0" y="262">qui imite le goût moyen des notateurs.</text>
</svg>
