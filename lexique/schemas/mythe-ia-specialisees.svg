<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img" aria-labelledby="mythe-ia-specialisees-t">
<title id="mythe-ia-specialisees-t">Bonnes réponses à l'examen médical MedQA, sur une échelle de 0 à 100 %. Med-PaLM 2, affiné pour la santé, fait 86,5 % en 2023 ; MedGemma, construit sur Gemma 3, fait 87,7 % en 2025 ; GPT-4 guidé par de simples consignes fait 90,2 % en 2023. Les trois tiennent en moins de quatre points.</title>
<text class="m mu" x="20" y="14">MedQA, part de bonnes réponses</text>
<text x="20" y="44">Med-PaLM 2, affiné pour la santé</text>
