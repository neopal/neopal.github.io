<text class="m ac" x="297" y="164">90,2 %</text>
<path class="lm" d="M20 180 H320"/>
<path class="lm" d="M20 176 V184 M170 176 V184 M320 176 V184"/>
<text class="m d" x="20" y="200">0 %</text>
