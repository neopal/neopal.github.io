<text class="m" x="286" y="64">86,5 %</text>
<text x="20" y="94">MedGemma, tiré de Gemma 3</text>
<rect class="fd" x="20" y="102" width="263.1" height="14" rx="2"/>
<rect class="lm" x="20" y="102" width="263.1" height="14" rx="2"/>
<text class="m" x="290" y="114">87,7 %</text>
<text x="20" y="144">GPT-4, simples consignes</text>
