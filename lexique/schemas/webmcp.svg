<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" role="img" aria-labelledby="webmcp-t">
<title id="webmcp-t">Avant et après WebMCP : sans lui, l'agent regarde la page et devine sur quel bouton cliquer ; avec lui, la page déclare ses outils dans document.modelContext et l'agent appelle directement add_to_cart.</title>
<text class="m d" x="0" y="14">sans WebMCP</text>
<rect class="bx" x="0" y="24" width="180" height="112" rx="6"/>
<rect class="fd" x="10" y="34" width="160" height="8" rx="2"/>
<rect class="fd" x="10" y="52" width="58" height="74" rx="3"/>
<rect class="fd" x="78" y="54" width="88" height="6" rx="2"/>
<rect class="fd" x="78" y="66" width="64" height="6" rx="2"/>
<rect class="bx" x="78" y="80" width="92" height="22" rx="4"/>
<text class="m" x="124" y="96" text-anchor="middle">Ajouter</text>
<rect class="bx" x="78" y="106" width="92" height="22" rx="4"/>
<text class="m" x="124" y="122" text-anchor="middle">Commander</text>
<rect class="bx" x="260" y="60" width="100" height="40" rx="6"/>
<text x="310" y="85" text-anchor="middle">agent</text>
<path class="lm dash" d="M256 74 Q220 74 178 91"/>
<path class="lm dash" d="M256 86 Q220 112 178 117"/>
<text class="big ac" x="212" y="104">?</text>
<path class="ln" d="M0 156 h360"/>
<text class="m d" x="0" y="182">avec WebMCP</text>
<rect class="bx" x="0" y="192" width="180" height="108" rx="6"/>
<text class="m d" x="10" y="212">document.modelContext</text>
<text class="m" x="14" y="238">search_catalog</text>
<rect class="bxa" x="6" y="248" width="168" height="22" rx="4"/>
<text class="m ac" x="14" y="264">add_to_cart</text>
<text class="m" x="14" y="290">proceed_to_checkout</text>
<rect class="bxa" x="260" y="239" width="100" height="40" rx="6"/>
<text x="310" y="264" text-anchor="middle">agent</text>
<path class="la" d="M256 259 H180"/><path class="la" d="M186 254 l-6 5 l6 5"/>
<text class="i mu" x="0" y="328">L'outil déclaré s'exécute dans l'onglet,</text>
<text class="i mu" x="0" y="348">avec la session de l'utilisateur.</text>
</svg>
