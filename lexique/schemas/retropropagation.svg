<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 338" role="img" aria-labelledby="retropropagation-t">
<title id="retropropagation-t">Une pile de quatre couches : l'aller monte du texte jusqu'à la loss en gardant les activations, le retour redescend en donnant son gradient à chaque couche, et ce retour coûte environ deux fois l'aller, contre 7 milliards de calculs complets pour tester les paramètres un par un.</title>
