<rect class="fd" x="136" y="136" width="10" height="10" rx="1"/>
<text class="m" x="180" y="146" text-anchor="middle">couche 1</text>
<rect class="fa" x="214" y="136" width="10" height="10" rx="1"/>
<text class="m mu" x="180" y="176" text-anchor="middle">texte</text>
<path class="lm" d="M112 160 V30"/><path class="lm" d="M107 36 l5 -6 l5 6"/>
<path class="la" d="M248 30 V158"/><path class="la" d="M243 152 l5 6 l5 -6"/>
<text class="m" x="102" y="88" text-anchor="end">forward</text>
<text class="m" x="102" y="106" text-anchor="end">pass</text>
<text class="m ac" x="258" y="88">backward</text>
<text class="m ac" x="258" y="106">pass</text>
<rect class="fd" x="0" y="196" width="10" height="10" rx="1"/>
