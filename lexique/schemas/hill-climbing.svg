<title id="hill-climbing-t">Six tours de hill climbing : à chaque tour une retouche est essayée ; elle est gardée quand le score du train et celui du test montent tous les deux, annulée quand seul le train monte ou quand le score baisse, et le score finit par plafonner sur un sommet local.</title>
