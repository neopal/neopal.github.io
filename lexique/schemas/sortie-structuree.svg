<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 324" role="img" aria-labelledby="sortie-structuree-t">
<title id="sortie-structuree-t">Un pas du décodage contraint : le modèle a écrit le début d'un objet JSON, et parmi les tokens candidats, les plus probables, comme « Avec » ou « Voici », sont écartés parce que le schéma n'autorise que facturation, livraison ou autre.</title>
<text class="m mu" x="0" y="16">schéma, champ categorie</text>
<text class="m" x="0" y="36">facturation, livraison ou autre</text>
<text class="m mu" x="0" y="70">réponse en cours</text>
<rect class="bx" x="0" y="80" width="360" height="30" rx="4"/>
<text class="m" x="10" y="100">{ categorie:</text>
<rect class="fa" x="118" y="88" width="9" height="16" opacity="0.8"/>
<text class="m mu" x="0" y="140">candidats pour le token suivant</text>
<text class="m d" x="0" y="164">Avec</text>
<rect class="fd" x="104" y="153" width="150" height="14" rx="2"/>
<path class="lr" d="M0 159.5 h34"/>
<text class="m d" x="0" y="186">Voici</text>
<rect class="fd" x="104" y="175" width="110" height="14" rx="2"/>
<path class="lr" d="M0 181.5 h42"/>
<text class="m ac" x="0" y="208">livraison</text>
<rect class="fa" x="104" y="197" width="84" height="14" rx="2"/>
<text class="m d" x="0" y="230">Bien</text>
<rect class="fd" x="104" y="219" width="60" height="14" rx="2"/>
<path class="lr" d="M0 225.5 h34"/>
<text class="m ac" x="0" y="252">facturation</text>
<rect class="fa" x="104" y="241" width="30" height="14" rx="2"/>
<text class="m ac" x="0" y="274">autre</text>
<rect class="fa" x="104" y="263" width="14" height="14" rx="2"/>
<text class="i mu" x="2" y="302">Ici, le schéma retire les tokens les plus</text>
<text class="i mu" x="2" y="320">probables, et le modèle tire parmi les autres.</text>
</svg>
