<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="version-epinglee-t">
<title id="version-epinglee-t">Un alias contre une version épinglée : l'alias claude-sonnet-4-5 pointe vers le snapshot le plus récent de sa version et peut changer de cible, alors que l'identifiant daté claude-sonnet-4-5-20250929 désigne toujours le même snapshot, jusqu'à sa date de retrait.</title>
<text class="m mu" x="0" y="14">les snapshots d'une version, dans le temps</text>
<path class="ln" d="M0 100 h360"/>
<circle class="fl" cx="60" cy="100" r="7"/>
<circle class="fa" cx="180" cy="100" r="9"/>
<circle class="fl" cx="300" cy="100" r="7"/>
<text class="m mu" x="60" y="130" text-anchor="middle">v1</text>
<text class="m ac" x="180" y="130" text-anchor="middle">v2</text>
<text class="m mu" x="300" y="130" text-anchor="middle">v3, demain</text>
<rect class="bx" x="200" y="30" width="160" height="34" rx="6"/>
<text class="m" x="280" y="52" text-anchor="middle">alias</text>
<path class="lm" d="M240 64 l-50 26"/><path class="lr dash" d="M300 64 v26"/>
<text class="m red" x="304" y="82">bougera</text>
<rect class="bxa" x="40" y="160" width="280" height="40" rx="6"/>
<text class="m ac" x="180" y="185" text-anchor="middle">identifiant épinglé</text>
<path class="la" d="M180 160 v-49"/><path class="la" d="M175 116 l5 -5 l5 5"/>
<path class="lm dash" d="M0 226 h360"/>
<text class="i mu" x="0" y="256">L'épinglé répond pareil jusqu'au retrait ;</text>
<text class="i mu" x="0" y="276">l'alias suit le prochain snapshot.</text>
</svg>
