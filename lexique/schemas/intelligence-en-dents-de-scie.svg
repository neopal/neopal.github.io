<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="intelligence-en-dents-de-scie-t">
<title id="intelligence-en-dents-de-scie-t">Cinq tâches classées de la plus facile à la plus difficile pour un humain ; la réussite du modèle monte et descend sans suivre cet ordre : il rate l'horloge, la comparaison de 9.11 et 9.9 et l'étude de cas piégée, et réussit les idées de chaussure et les Olympiades de maths.</title>
<text class="m mu" x="0" y="16">facile</text>
<text class="m mu" x="130" y="16">réussite du modèle</text>
<path class="lm" d="M8 28 V250"/><path class="lm" d="M3 244 l5 6 l5 -6"/>
<text class="m" x="20" y="54">lire l'heure</text>
<rect class="fa" x="130" y="42" width="25" height="16" rx="3"/>
<text class="m" x="163" y="54">13,3 %</text>
<text class="m" x="20" y="99">9.11 ou 9.9 ?</text>
<rect class="fa" x="130" y="87" width="16" height="16" rx="3"/>
<text class="m red" x="154" y="99">raté</text>
<text class="m" x="20" y="138">dix idées</text>
<text class="m" x="20" y="154">de chaussure</text>
<rect class="fa" x="130" y="132" width="160" height="16" rx="3"/>
<text class="m" x="298" y="144">réussi</text>
<text class="m" x="20" y="183">étude de cas</text>
<text class="m" x="20" y="199">piégée</text>
<rect class="fa" x="130" y="177" width="30" height="16" rx="3"/>
<text class="m red" x="168" y="189">raté</text>
<text class="m" x="20" y="228">Olympiades</text>
<text class="m" x="20" y="244">de maths</text>
<rect class="fa" x="130" y="222" width="158" height="16" rx="3"/>
<text class="m" x="296" y="234">5 sur 6</text>
<text class="m mu" x="0" y="268">difficile pour un humain</text>
<text class="i mu" x="4" y="290">La réussite ne suit pas la difficulté humaine.</text>
</svg>
